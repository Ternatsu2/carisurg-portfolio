<text x="842" y="205" text-anchor="end" class="t">Unknown</text>
<rect x="850" y="192" width="0.1" height="14" class="bar"/>
<text x="855.1395596118914" y="204" class="s">35</text>
<text x="550" y="495" text-anchor="middle" class="s">These fields should be used for subgroup evaluation, not automatic triage decisions.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<style>
text { font-family: Arial, sans-serif; fill:#111; }
.title { font-size:24px; font-weight:700; }
.h { font-size:16px; font-weight:700; }
.t { font-size:12px; }
.s { font-size:10px; fill:#444; }
.axis { stroke:#333; stroke-width:1; }
.grid { stroke:#ddd; stroke-width:1; }
.bar { fill:#8c4a2f; }
.dark { fill:#333333; }
.grey { fill:#777777; }
</style>
<rect width="1100" height="520" fill="white"/>
<text x="550.0" y="30" text-anchor="middle" class="title">Demographic Fields for Subgroup Review</text>

<text x="80" y="70" class="h">Race</text>
<text x="302" y="103" text-anchor="end" class="t">White or Caucasian</text>
<rect x="310" y="90" width="300.0" height="14" class="dark"/>
<text x="615.0" y="102" class="s">29,435</text>
<text x="302" y="131" text-anchor="end" class="t">Black or African American</text>

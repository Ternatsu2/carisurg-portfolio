<text x="477.6940716833701" y="130" class="s">15,963</text>
<text x="302" y="159" text-anchor="end" class="t">Other</text>
<rect x="310" y="146" width="91.9" height="14" class="dark"/>
<text x="406.8906064209275" y="158" class="s">9,016</text>
<text x="302" y="187" text-anchor="end" class="t">Patient Refused</text>
<rect x="310" y="174" width="3.8" height="14" class="dark"/>
<text x="318.77102089349415" y="186" class="s">370</text>
<text x="302" y="215" text-anchor="end" class="t">Asian</text>
<rect x="310" y="202" width="1.8" height="14" class="dark"/>
<text x="316.78359096313915" y="214" class="s">175</text>
<text x="302" y="243" text-anchor="end" class="t">Unknown</text>
<rect x="310" y="230" width="0.8" height="14" class="dark"/>
<text x="315.7745880754204" y="242" class="s">76</text>
<text x="302" y="271" text-anchor="end" class="t">American Indian or Alaska Native</text>
<rect x="310" y="258" width="0.7" height="14" class="dark"/>
<text x="315.67266859181245" y="270" class="s">66</text>
<text x="680" y="70" class="h">Ethnicity</text>
<text x="842" y="103" text-anchor="end" class="t">Non-Hispanic</text>
<rect x="850" y="90" width="180.0" height="14" class="bar"/>
<text x="1035.0" y="102" class="s">45,142</text>
<text x="842" y="137" text-anchor="end" class="t">Hispanic or Latino</text>
<rect x="850" y="124" width="39.4" height="14" class="bar"/>
<text x="894.4275840680519" y="136" class="s">9,888</text>
<text x="842" y="171" text-anchor="end" class="t">Patient Refused</text>

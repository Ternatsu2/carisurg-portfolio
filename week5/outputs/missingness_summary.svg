<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <style>
    text { font-family: Arial, sans-serif; fill: #111; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 13px; fill: #333; }
    .axis { stroke: #444; stroke-width: 1; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .bar { fill: #a15c38; }
    .zero { fill: #666; }
  </style>
  <rect width="980" height="360" fill="#fff"/>
  <text x="490" y="34" text-anchor="middle" class="title">Missing Values by File and Column</text>
  <line x1="260" y1="70" x2="260" y2="305" class="axis"/>
  <line x1="260" y1="305" x2="900" y2="305" class="axis"/>
  <line x1="473" y1="70" x2="473" y2="305" class="grid"/>
  <line x1="687" y1="70" x2="687" y2="305" class="grid"/>
  <line x1="900" y1="70" x2="900" y2="305" class="grid"/>
  <text x="260" y="326" text-anchor="middle" class="small">0</text>
  <text x="473" y="326" text-anchor="middle" class="small">1</text>
  <text x="687" y="326" text-anchor="middle" class="small">2</text>
  <text x="900" y="326" text-anchor="middle" class="small">3</text>
  <text x="580" y="350" text-anchor="middle" class="small">Missing values</text>
  <text x="245" y="95" text-anchor="end" class="label">Wallet import | card_bin</text>
  <rect x="260" y="78" width="427" height="24" class="bar"/>
  <text x="700" y="96" class="label">2 missing, 40.0%</text>
  <text x="245" y="134" text-anchor="end" class="label">Wallet import | all other fields</text>
  <rect x="260" y="122" width="4" height="18" class="zero"/>
  <text x="275" y="136" class="small">0 missing</text>
  <text x="245" y="174" text-anchor="end" class="label">Evidence summary | all fields</text>
  <rect x="260" y="162" width="4" height="18" class="zero"/>
  <text x="275" y="176" class="small">0 missing</text>
  <text x="260" y="224" class="small">Read: the only missing values are card BINs on ACH withdrawal rows. I treated that as expected missingness for this sample, not as failed data entry.</text>
</svg>
